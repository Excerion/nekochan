    <!-- Mouth -->
    <path d="M 28 43 Q 32 46 32 42 Q 32 46 36 43" fill="none" stroke="#800000" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="8" y1="38" x2="20" y2="40" stroke="#800000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="7" y1="44" x2="20" y2="43" stroke="#800000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="56" y1="38" x2="44" y2="40" stroke="#800000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="57" y1="44" x2="44" y2="43" stroke="#800000" stroke-width="1.5" stroke-linecap="round"/>
</svg>
